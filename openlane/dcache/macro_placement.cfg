# Manual macro placement: <instance name> <x> <y> <orientation>
#
# Five 2KB macros: four 32-bit data banks (d0..d3) plus the {valid,tag} array,
# giving a 512-set x 16B = 8KB direct-mapped D-cache.
#
# LAYOUT IS DICTATED BY PIN GEOMETRY, exactly as in openlane/sram_test. Each
# macro carries all 125 signal pins on met4 along its BOTTOM edge, and blocks
# met1-met3 across its whole footprint. So every macro must have that edge
# facing open standard-cell area, or the router has to go around a wall for
# the three lowest layers - which is what produced GRT-0119 in Phase 1.
#
# That constraint is why the five are in a SINGLE ROW, all N, rather than a
# compact 2x3 block: one row means one shared channel below serves all five
# pin edges, and the cache's control logic (FSM, word muxes, the 512 dirty
# flops) sits in it, close to every macro it talks to. The cost is a wide,
# short die - roughly 4.8:1 - which is unusual but legal.
#
#   macro      683.1 x 416.54 each, 100 um apart
#   row span   5*683.1 + 4*100 = 3815.5, starting at x=150
#   die        4120 x 900
#   below      350 um of full-width cell area, under every pin edge
#   above      133.5 um for PDN straps and the met5 ring
#
# The gaps were 30 um on the first attempt and that failed GRT-0119 with 5
# vertical-congestion violations, all between macros 2 and 3 (x 1580..2346)
# and just below them. 30 um is not a 30 um channel: PL_MACRO_HALO reserves
# 10 um on each side and the PDN halo takes more, so almost nothing was left
# to route through - while 125 pins per macro were all trying to escape
# downward through it. 100 um leaves a real channel. The below-macro region
# went 250 -> 350 um for the same reason: it carries every pin escape from
# every macro plus all the control logic.
#
# The alternative worth trying IF this congests: two rows, the upper one
# mirrored (MX) so its pins face up, giving channels above and below and a
# squarer ~2350 x 1300 die. It splits the control logic across two regions,
# which is why it is the fallback and not the first attempt.
#
# Instance names must match the SYNTHESIS NETLIST exactly, with no leading
# escape backslash. The generate block is g_sram and each wrapper is u_dN, so
# the flattened names below are the expected result - verify against
# results/synthesis/dcache_bram.v before a full run, because a wrong name
# fails quietly: the macro gets auto-placed and FP_PDN_MACRO_HOOKS connects
# nothing.
g_sram.u_d0.u_macro    150.0  350 N
g_sram.u_d1.u_macro    933.1  350 N
g_sram.u_d2.u_macro   1716.2  350 N
g_sram.u_d3.u_macro   2499.3  350 N
g_sram.u_tagv.u_macro 3282.4  350 N
