# Manual macro placement: <instance name> <x> <y> <orientation>
#
# Eleven 2KB macros: six for the 8KB I-cache, five for the 8KB D-cache.
#
#   ICACHE.BRAM_CACHE  u_de_lo/u_de_hi  dat_even, 64b across two macros
#                      u_do_lo/u_do_hi  dat_odd,  likewise
#                      u_tagA/u_tagB    the two mirrored {valid,tag} arrays
#   DCACHE.core_inst   u_d0..u_d3       the four 32-bit data banks
#                      u_tagv           {valid,tag}
#
# TWO ROWS FACING ONE CENTRAL CHANNEL
#
#   +--------------------------------------------------+  y=2160 die
#   |  6 icache macros    N   pins DOWN                |
#   |------------------ pin edge ----------------------|  y=1680
#   |                                                  |
#   |        CPU logic  (1203 um, 5.90 mm^2)           |
#   |                                                  |
#   |------------------ pin edge ----------------------|  y=476.5
#   |  5 dcache macros    FS  pins UP                  |
#   +--------------------------------------------------+  y=0 die
#
# REVISION HISTORY - four routing attempts, each narrowing the cause.
# READ THIS BEFORE CHANGING ANY DIMENSION HERE. Two of the four changes made
# things worse or did nothing; the geometry below is rev2's, restored.
#
# rev1  803 um channel, halo 10x10.  GRT-0232 after 55 min, 318 "Missing
#       route to pin" warnings. NOT a placement problem: 97.8% of logic cells
#       were already inside the channel at 16.58% utilisation.
#
# rev2  channel 803 -> 1203 um.  Fixed it: missing-route warnings 318 -> 0,
#       error became plain GRT-0119 with 35 locatable violations. Eleven
#       macros put ~1,375 met4 pins on the channel edges and contribute
#       242,400 blockages, derating routing 52-67% on every layer; the extra
#       height is for ESCAPES, not for cells.
#
# rev3  halo 10x10 -> 10x40, reasoning that cells crowding the pin row were
#       starving the escapes.  NO EFFECT AT ALL - byte-identical 35
#       violations. The reasoning was wrong: the violations sit at y 455-469,
#       which is INSIDE the D-cache footprint (60..476.5), not in the cell
#       area above it, so a placement halo could never have moved them.
#
# rev4  macro rows pushed FLUSH with the core boundary to remove the 60 um
#       margins, on the theory that cells stranded there had to cross a macro
#       to reach anything.  MUCH WORSE - 35 -> 6,355 violations, and the
#       stranded count barely moved (2,100 -> 1,988) because those cells sit
#       in the horizontal slivers BESIDE the macro rows, not below them.
#       The 49 um strip under the D-cache row was evidently carrying real
#       routing; removing it cost far more than the stranding did. REVERTED.
#
# rev5  (current) rev2 geometry restored exactly, with GRT_ALLOW_CONGESTION=1
#       as the only change. rev2's 35 violations are marginal - overflow of
#       1-2 tracks on 35 GCells out of a design with ~1.2M vias - which is
#       the case detailed routing is normally able to absorb. Geometry has
#       been pushed twice now with no gain; this stops pushing it.
#
# Every macro carries all 125 of its signal pins on met4 along ONE edge and
# blocks met1-met3 across its footprint, so each pin edge must face open
# standard-cell area. Pointing both rows inward means a single unified logic
# region serves all eleven, instead of the CPU being split either side of a
# macro wall.
#
# FS is verified, not assumed: openlane/icache run `fs_probe` placed the same
# six macros FS with the channel moved above them, and it routed clean
# (WNS/TNS 0.0). Had FS left the pins underneath they would have faced a
# 133 um margin and congested.
#
# 100 um inter-macro gaps come from openlane/dcache/NOTES.md - at 30 um the
# D-cache failed GRT-0119, because PL_MACRO_HALO takes 10 um per side and the
# PDN halo more, leaving nothing for 125 pins to escape through.
#
# PL_MACRO_HALO is "10 40". The 40 is kept only because it is harmless and
# gives the escapes clearance; rev3 proved it does NOT fix congestion here.
# Horizontal stays 10 deliberately - the 100 um gaps exist FOR routing, and a
# large horizontal halo would close them.
#
# Channel sizing is set by ROUTING, not by cell area. The macro build is
# 88,932 synth / 107,808 post-PnR cells - 16,544 FEWER than the flop build,
# since the arrays moved into macros - and needs only ~2.8 mm^2 at the
# measured ~39,000 cells/mm^2. The channel is 1304 um x 4900 um = 6.39 mm^2,
# over 2x that, and utilisation lands near 17%. The extra height is entirely
# for pin escapes.
#
# Instance names must match the SYNTHESIS NETLIST exactly, without the escape
# backslash - verify against results/synthesis/cpu_pipelined.v before relying
# on a full run; a wrong name auto-places the macro and connects no power.

# --- I-cache row, top, N (pins face down into the channel) ---
ICACHE.BRAM_CACHE.g_sram.u_de_lo.u_macro    150.0  1680 N
ICACHE.BRAM_CACHE.g_sram.u_de_hi.u_macro    933.1  1680 N
ICACHE.BRAM_CACHE.g_sram.u_do_lo.u_macro   1716.2  1680 N
ICACHE.BRAM_CACHE.g_sram.u_do_hi.u_macro   2499.3  1680 N
ICACHE.BRAM_CACHE.g_sram.u_tagA.u_macro    3282.4  1680 N
ICACHE.BRAM_CACHE.g_sram.u_tagB.u_macro    4065.5  1680 N

# --- D-cache row, bottom, FS (pins face up into the channel) ---
DCACHE.core_inst.g_sram.u_d0.u_macro        542.0   60 FS
DCACHE.core_inst.g_sram.u_d1.u_macro       1325.1   60 FS
DCACHE.core_inst.g_sram.u_d2.u_macro       2108.2   60 FS
DCACHE.core_inst.g_sram.u_d3.u_macro       2891.3   60 FS
DCACHE.core_inst.g_sram.u_tagv.u_macro     3674.4   60 FS
