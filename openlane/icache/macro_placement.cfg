# Manual macro placement: <instance name> <x> <y> <orientation>
#
# Six 2KB macros forming a 512-set x 16B = 8KB direct-mapped I-cache:
#
#   u_de_lo / u_de_hi   dat_even, 64 bits split across two 32-bit macros
#   u_do_lo / u_do_hi   dat_odd,  likewise
#   u_tagA / u_tagB     the two mirrored {valid,tag} arrays
#
# dat_even and dat_odd are read at INDEPENDENT indices (erow vs orow), as are
# tagA and tagB (idxA vs idxB) - that is what lets a 32-bit instruction
# straddling a line boundary be fetched in one cycle once RVC is in play. The
# two halves of a 64-bit bank share their bank's index, so splitting a bank
# across two macros does not disturb it.
#
# Layout follows the recipe proven in openlane/dcache (see its NOTES.md):
# single row, all N, so every macro's met4 pin edge - the only edge it has,
# with met1-met3 blocked across the footprint - faces one shared channel
# below, where the FSM and stitch logic sit.
#
#   macro      683.1 x 416.54 each, 100 um apart
#   row span   6*683.1 + 5*100 = 4598.6, starting at x=150
#   die        4900 x 900
#   below      350 um of full-width cell area, under every pin edge
#   above      133.5 um for PDN straps and the met5 ring
#
# 100 um is not padding: at 30 um the D-cache run failed GRT-0119, because
# PL_MACRO_HALO takes 10 um per side and the PDN halo more, leaving almost
# nothing for 125 pins per macro to escape through.
#
# Instance names must match the SYNTHESIS NETLIST exactly, without the escape
# backslash. Verify against results/synthesis/icache_bram.v before a full run
# - a wrong name fails quietly, auto-placing the macro and connecting no power.
g_sram.u_de_lo.u_macro   150.0  350 N
g_sram.u_de_hi.u_macro   933.1  350 N
g_sram.u_do_lo.u_macro  1716.2  350 N
g_sram.u_do_hi.u_macro  2499.3  350 N
g_sram.u_tagA.u_macro   3282.4  350 N
g_sram.u_tagB.u_macro   4065.5  350 N
