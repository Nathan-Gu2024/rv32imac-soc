# Manual macro placement: <instance name> <x> <y> <orientation>
#
# Automatic macro placement pushes macros to the die edge without regard for
# I/O pin location, so it is not used here.
#
# POSITION IS DICTATED BY THE MACRO'S PIN AND OBSTRUCTION GEOMETRY, not by
# symmetry. From the LEF:
#
#   - all 125 signal pins sit on met4 along the macro's BOTTOM edge
#     (every pin RECT has y = 0.0 .. 1.06 in macro-local coordinates)
#   - OBS blocks met1, met2 AND met3 across the entire footprint
#
# So the macro is a wall for the three lowest routing layers, and everything
# that talks to it has to arrive at one edge. Centering it (the obvious first
# guess, and what this file did originally) let the placer put consumer cells
# above the macro; their nets then had to travel from the bottom-edge pins
# around the whole block, and global routing failed with GRT-0119 - the
# reported congestion sat exactly on the macro's TOP edge, on u_sram.rdata
# bits, which is the signature of routing the long way around.
#
# Instead the macro is pushed to the TOP of the die so its pin edge faces one
# large, uninterrupted standard-cell region:
#
#   die     1000 x 900
#   macro    683.1 x 416.54, placed at (158, 383)
#            -> occupies x 158 .. 841.1, y 383 .. 799.54
#   below    383 um of full-width cell area, directly under the pins
#   above    100.5 um, enough for PDN straps and the met5 ring
#   sides    ~158 um each
#
# PL_MACRO_HALO in config.json additionally keeps cells 10 um off the macro
# so nothing is placed hard against the pin row.
#
# The instance name must match the SYNTHESIS NETLIST exactly, with no leading
# escape backslash. Verified against results/synthesis/sram_test.v, which
# emits it as \u_sram.u_macro - a wrong name here fails quietly: the macro
# gets auto-placed instead and FP_PDN_MACRO_HOOKS connects nothing.
u_sram.u_macro 158 383 N
