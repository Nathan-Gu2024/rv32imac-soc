CONFIG_CACHE_MANAGEMENT=y
CONFIG_EXTERNAL_CACHE=y
CONFIG_GEMM_RV32_5STAGE=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096

# The worker thread stopped being scheduled the moment the gemm thread
# started, with no error - which is what a stack overflow looks like on a CPU
# with no illegal-instruction trap: a smashed return address just executes
# whatever it points at. The sentinel turns that into a reported fault.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
