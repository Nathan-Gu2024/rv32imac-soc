# Overlay that removes everything this demo added to the CONTEXT SWITCH, to
# separate the measurement from the thing being measured.
#
# The sweep showed completion-interrupt entry pinned at ~1800 cycles regardless
# of how much work the batch contained, while the same hardware measured
# 454..2067 under polling. K_FOREVER ruled out z_add_timeout (worth only ~90-175
# cycles), so the remaining suspects are whatever else runs with interrupts
# disabled while a thread blocks - and three of them were switched on by this
# sample's own prj.conf during earlier debugging:
#
#   CONFIG_SCHED_THREAD_USAGE   hooks the switch and reads the cycle counter,
#                               which on this core is an MMIO access to the
#                               CLINT (~9 cycles), twice per switch
#   CONFIG_STACK_SENTINEL       checks a guard word on every switch
#   CONFIG_THREAD_MONITOR       maintains a thread list
#
# A device interrupt cannot be serviced until the switch re-enables interrupts,
# so anything added here lands directly on interrupt latency for EVERY device on
# the board, not just the accelerator.
#
# What survives: wall, accel and wake, because the driver times those with
# k_cycle_get_32() itself rather than through thread accounting. What is lost:
# the subCPU and worker columns, and the thread table. Run both builds and
# compare `accel` - the difference is the harness's own cost.
#
# Use:  scripts/build_zephyr_gemm.sh -l

CONFIG_STACK_SENTINEL=n
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_SCHED_THREAD_USAGE=n
CONFIG_SCHED_THREAD_USAGE_ALL=n
CONFIG_THREAD_MONITOR=n
CONFIG_INIT_STACKS=n
CONFIG_THREAD_STACK_INFO=n

# Kept: naming costs nothing at switch time and keeps the output readable.
CONFIG_THREAD_NAME=y
